# Database Configuration (defaults for local dev; overridden by env vars in K8s)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/blog_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:tochratana}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:rmV2lyUfrk+NTfmLXWQKAMGm/WutkgSCn96nwT60f1Usg8NWH+apJNBozIBrS1c+Vg6zR9O1Sd3wUei4udEB9A==}
jwt.expiration=86400000

# Server Configuration
server.port=${SERVER_PORT:8080}

# Logging
logging.level.org.springframework.security=${LOGGING_LEVEL:INFO}

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# File Storage
file.upload-dir=./uploads
file.profile-dir=./uploads/profiles
file.blog-dir=./uploads/blogs
